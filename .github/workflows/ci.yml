name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # Caches Gradle state and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test
