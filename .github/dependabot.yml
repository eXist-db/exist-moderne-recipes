version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      openrewrite:
        patterns:
          - "org.openrewrite*"
      test-dependencies:
        patterns:
          - "org.assertj:*"
